provider:
  name: laravelcloud

resources:
  applications:
    create:
      path: /applications
      method: POST
    read:
      path: /applications/{application}
      method: GET
    update:
      path: /applications/{application}
      method: PATCH
    delete:
      path: /applications/{application}
      method: DELETE

  environments:
    create:
      path: /applications/{application}/environments
      method: POST
    read:
      path: /environments/{environment}
      method: GET
    update:
      path: /environments/{environment}
      method: PATCH
    delete:
      path: /environments/{environment}
      method: DELETE

  instances:
    create:
      path: /environments/{environment}/instances
      method: POST
    read:
      path: /instances/{instance}
      method: GET
    update:
      path: /instances/{instance}
      method: PATCH
    delete:
      path: /instances/{instance}
      method: DELETE

  background_processes:
    create:
      path: /instances/{instance}/background-processes
      method: POST
    read:
      path: /background-processes/{backgroundProcess}
      method: GET
    update:
      path: /background-processes/{backgroundProcess}
      method: PATCH
    delete:
      path: /background-processes/{backgroundProcess}
      method: DELETE

  buckets:
    create:
      path: /buckets
      method: POST
    read:
      path: /buckets/{filesystem}
      method: GET
    update:
      path: /buckets/{filesystem}
      method: PATCH
    delete:
      path: /buckets/{filesystem}
      method: DELETE

  bucket_keys:
    create:
      path: /buckets/{filesystem}/keys
      method: POST
    read:
      path: /bucket-keys/{filesystemKey}
      method: GET
    update:
      path: /bucket-keys/{filesystemKey}
      method: PATCH
    delete:
      path: /bucket-keys/{filesystemKey}
      method: DELETE

  caches:
    create:
      path: /caches
      method: POST
    read:
      path: /caches/{cache}
      method: GET
    update:
      path: /caches/{cache}
      method: PATCH
    delete:
      path: /caches/{cache}
      method: DELETE

  database_clusters:
    create:
      path: /databases/clusters
      method: POST
    read:
      path: /databases/clusters/{database}
      method: GET
    update:
      path: /databases/clusters/{database}
      method: PATCH
    delete:
      path: /databases/clusters/{database}
      method: DELETE

  database_schemas:
    create:
      path: /databases/clusters/{database}/databases
      method: POST
    read:
      path: /databases/clusters/{database}/databases/{schema}
      method: GET
    delete:
      path: /databases/clusters/{database}/databases/{schema}
      method: DELETE

  database_snapshots:
    create:
      path: /databases/clusters/{database}/snapshots
      method: POST
    read:
      path: /database-snapshots/{databaseSnapshot}
      method: GET
    delete:
      path: /database-snapshots/{databaseSnapshot}
      method: DELETE

  websocket_clusters:
    create:
      path: /websocket-servers
      method: POST
    read:
      path: /websocket-servers/{websocketServer}
      method: GET
    update:
      path: /websocket-servers/{websocketServer}
      method: PATCH
    delete:
      path: /websocket-servers/{websocketServer}
      method: DELETE

  websocket_applications:
    create:
      path: /websocket-servers/{websocketServer}/applications
      method: POST
    read:
      path: /websocket-applications/{websocketApplication}
      method: GET
    update:
      path: /websocket-applications/{websocketApplication}
      method: PATCH
    delete:
      path: /websocket-applications/{websocketApplication}
      method: DELETE

  domains:
    schema:
      ignores:
        - wildcard
        - www
    create:
      path: /environments/{environment}/domains
      method: POST
    read:
      path: /domains/{domain}
      method: GET
    update:
      path: /domains/{domain}
      method: PATCH
    delete:
      path: /domains/{domain}
      method: DELETE

  commands:
    create:
      path: /environments/{environment}/commands
      method: POST
    read:
      path: /commands/{command}
      method: GET

  deployments:
    create:
      path: /environments/{environment}/deployments
      method: POST
    read:
      path: /deployments/{deployment}
      method: GET
